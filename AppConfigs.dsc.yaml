- name: PowerShellProfile
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - |
        if (Test-Path "C:\code\powershell-profile\.git") {
            git -C "C:\code\powershell-profile" pull --ff-only
        } else {
            git clone https://github.com/kkthxbye/powershell-profile.git "C:\code\powershell-profile"
        }
        pwsh -NoLogo -NonInteractive -NoProfile -File "C:\code\powershell-profile\Install-Profile.ps1"
