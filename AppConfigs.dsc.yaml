      - 'Install-AWSToolsModule -Name Athena, Bedrock, CloudWatch, CloudWatchLogs, Common, CostExplorer, EC2, ECR, EKS, Glue, IdentityManagement, MQ, MWAA, Organizations, RDS, S3, SecretsManager, SecurityToken -Scope CurrentUser -CleanUp -Force'
- name: UvTools
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
