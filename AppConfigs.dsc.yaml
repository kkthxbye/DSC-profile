- name: FarManagerConfig
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - |
        New-Item -ItemType Directory -Force -Path "~\AppData\Roaming\Far Manager\Profile"
        Copy-Item `
            -Path "$env:DSC_CONFIG_ROOT\configs\farmanager\*.db" `
            -Exclude "localconfig.db" `
            -Destination "~\AppData\Roaming\Far Manager\Profile\" `
            -Force
        New-Item -ItemType Directory -Force -Path "~\AppData\Roaming\Far Manager\Profile\PluginsData"
        Copy-Item `
            -Path "$env:DSC_CONFIG_ROOT\configs\farmanager\PluginsData\*.db" `
            -Destination "~\AppData\Roaming\Far Manager\Profile\PluginsData\" `
            -Force
        New-Item -ItemType Directory -Force -Path "~\AppData\Local\Far Manager\Profile"
        Copy-Item `
            -Path "$env:DSC_CONFIG_ROOT\configs\farmanager\localconfig.db" `
            -Destination "~\AppData\Local\Far Manager\Profile\" `
            -Force
