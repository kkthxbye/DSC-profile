- name: PowerShellModules
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - 'Install-Module -Name PSFzf, powershell-yaml, Microsoft.WinGet.Client, CompletionPredictor, AWS.Tools.Installer, AWSCompleter, dotenv, Graphical, InvokeBuild, JoinModule, Microsoft.PowerShell.Crescendo, posh-cli, PowerShell-Beautifier, PSParquet, PSProfiler, PSReadLine, PSScriptAnalyzer, SqlServer, Sudo -Scope CurrentUser -Force -AllowClobber'
- name: AWSToolsModules
  type: Microsoft.DSC.Transitional/RunCommandOnSet
