      - -NoProfile
      - -Command
      - '@("sqlfluff") | ForEach-Object { uv tool install $_ }'
- name: UvToolsOnUserPath
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - |
        $dir = "$env:USERPROFILE\.local\bin"
        $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
        $parts = @($userPath -split ";" | Where-Object { $_ })
        if ($parts -notcontains $dir) {
            [System.Environment]::SetEnvironmentVariable("Path", (($parts + $dir) -join ";"), "User")
        }
- name: PowerShellProfile
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - |
        if (Test-Path "$env:DSC_CONFIG_ROOT\..\powershell-profile\.git") {
            git -C "$env:DSC_CONFIG_ROOT\..\powershell-profile" pull --ff-only
        } else {
            git clone https://github.com/kkthxbye/powershell-profile.git "$env:DSC_CONFIG_ROOT\..\powershell-profile"
        }
        pwsh -NoLogo -NonInteractive -NoProfile -File "$env:DSC_CONFIG_ROOT\..\powershell-profile\Install-Profile.ps1"
