resources:
- name: VsCodeSettings
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - |
        New-Item -ItemType Directory -Force -Path "~\AppData\Roaming\Code\User"
        Copy-Item `
            -LiteralPath "C:\code\DSC-profile\configs\vscode\settings.json" `
            -Destination "~\AppData\Roaming\Code\User\settings.json" `
            -Force
