$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
resources:
- name: DscProfileHome
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Environment
    valueName: DSC_PROFILE_HOME
    valueData:
      String: C:\code\DSC-profile
- name: CodeWorkspaceRoot
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - 'New-Item -ItemType Directory -Force -Path "C:\code" | Out-Null'
- name: UserLanguageList
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - '$list = New-WinUserLanguageList -Language en-US; $list.Add((New-WinUserLanguageList -Language pl)[0]); $list.Add((New-WinUserLanguageList -Language ru)[0]); Set-WinUserLanguageList -LanguageList $list -Force'
- name: RegionalFormat
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - 'Set-Culture -CultureInfo en-GB; Set-WinHomeLocation -GeoId 191; Set-ItemProperty -Path "HKCU:\Control Panel\International" -Name sShortDate -Value "dd.MM.yyyy"; Set-ItemProperty -Path "HKCU:\Control Panel\International" -Name sLongDate -Value "dd MMMM yyyy"; Set-ItemProperty -Path "HKCU:\Control Panel\International" -Name sDate -Value "."; Set-ItemProperty -Path "HKCU:\Control Panel\International" -Name sShortTime -Value "HH:mm"; Set-ItemProperty -Path "HKCU:\Control Panel\International" -Name sTimeFormat -Value "HH:mm:ss"; Set-ItemProperty -Path "HKCU:\Control Panel\International" -Name iTime -Value "1"; Set-ItemProperty -Path "HKCU:\Control Panel\International" -Name iTLZero -Value "1"'
- name: ShowKnownFileExtensions
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    valueName: HideFileExt
    valueData:
      DWord: 0
- name: ExplorerLaunchToThisPC
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    valueName: LaunchTo
    valueData:
      DWord: 1
- name: EnableLongPaths
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKLM\SYSTEM\CurrentControlSet\Control\FileSystem
    valueName: LongPathsEnabled
    valueData:
      DWord: 1
- name: EnableUAC
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    valueName: EnableLUA
    valueData:
      DWord: 1
- name: UACSilentElevation
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    valueName: ConsentPromptBehaviorAdmin
    valueData:
      DWord: 0
- name: DeveloperMode
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock
    valueName: AllowDevelopmentWithoutDevLicense
    valueData:
      DWord: 1
- name: PowerShellExecutionPolicy
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - 'Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force'
- name: TaskbarEndTask
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    valueName: TaskbarEndTask
    valueData:
      DWord: 0
- name: DefaultTerminalConsole
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Console\%%Startup
    valueName: DelegationConsole
    valueData:
      String: "{00000000-0000-0000-0000-000000000000}"
- name: DefaultTerminalApp
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Console\%%Startup
    valueName: DelegationTerminal
    valueData:
      String: "{00000000-0000-0000-0000-000000000000}"
- name: SnapWindows
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Control Panel\Desktop
    valueName: WindowArrangementActive
    valueData:
      String: "1"
- name: SnapAssist
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    valueName: SnapAssist
    valueData:
      DWord: 0
- name: SnapAssistFlyout
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    valueName: EnableSnapAssistFlyout
    valueData:
      DWord: 0
- name: SnapAssistDragToTop
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    valueName: DITest
    valueData:
      DWord: 0
- name: DesktopWallpaperPath
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Control Panel\Desktop
    valueName: WallPaper
    valueData:
      String: C:\code\DSC-profile\configs\wallpaper\wallpaper.jpg
- name: DesktopWallpaperStyle
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Control Panel\Desktop
    valueName: WallpaperStyle
    valueData:
      String: "10"
- name: DesktopWallpaperTile
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKCU\Control Panel\Desktop
    valueName: TileWallpaper
    valueData:
      String: "0"
- name: LockScreenImagePath
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP
    valueName: LockScreenImagePath
    valueData:
      String: C:\code\DSC-profile\configs\wallpaper\lockscreen.jpg
- name: LockScreenImageUrl
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP
    valueName: LockScreenImageUrl
    valueData:
      String: C:\code\DSC-profile\configs\wallpaper\lockscreen.jpg
- name: LockScreenImageStatus
  type: Microsoft.Windows/Registry
  properties:
    keyPath: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP
    valueName: LockScreenImageStatus
    valueData:
      DWord: 1
- name: DefenderRunning
  type: Microsoft.Windows/Service
  properties:
    name: WinDefend
    status: Running
    startType: Automatic
- name: WindowsUpdateRunning
  type: Microsoft.Windows/Service
  properties:
    name: wuauserv
    status: Running
    startType: Automatic
