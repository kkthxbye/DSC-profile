$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor:
      identifier: "dscv3"
resources:
- name: winget_source
  type: Microsoft.WinGet/Source
  properties:
    type: "Microsoft.PreIndexed.Package"
    trustLevel: "trusted"
    argument: "https://cdn.winget.microsoft.com/cache"
    name: "winget"
- name: winget_Microsoft.WSL
  type: Microsoft.WinGet/Package
  dependsOn: ["[resourceId('Microsoft.WinGet/Source', 'winget_source')]"]
  properties:
    id: "Microsoft.WSL"
    source: "winget"
- name: WslConfig
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - |
        Copy-Item `
            -LiteralPath "$env:DSC_CONFIG_ROOT\configs\wsl\.wslconfig" `
            -Destination "~\.wslconfig" `
            -Force
- name: WslUbuntu
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - '& "$env:DSC_CONFIG_ROOT\scripts\wsl\Install-Ubuntu.ps1"'
- name: WslAnsiblePlaybook
  type: Microsoft.DSC.Transitional/RunCommandOnSet
  properties:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NonInteractive
      - -NoProfile
      - -Command
      - '& "$env:DSC_CONFIG_ROOT\scripts\wsl\Invoke-AnsiblePlaybook.ps1"'
